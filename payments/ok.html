<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оплата прошла успешно</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eef9f1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #1f2933;
      padding: 24px;
      box-sizing: border-box;
    }
    .box {
      max-width: 460px;
      text-align: center;
      background: #fff;
      border-radius: 18px;
      padding: 40px 28px;
      box-shadow: 0 12px 40px rgba(47, 158, 68, 0.16);
      border: 2px solid #2f9e44;
    }
    .icon { font-size: 48px; line-height: 1; }
    h1 { font-size: 24px; margin: 16px 0 8px; }
    p { color: #52606d; line-height: 1.5; margin: 0 0 24px; }
    a {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 10px;
      background: #2f9e44;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">✅</div>
    <h1>Оплата прошла успешно</h1>
    <p>Это тестовая страница рабочего платёжного сервиса. Реальный платёж не создавался.</p>
